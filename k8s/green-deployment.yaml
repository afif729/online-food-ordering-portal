apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: foodiehub
      color: green
  template:
    metadata:
      labels:
        app: foodiehub
        color: green
    spec:
      containers:
        - name: foodiehub
          image: afif729/online-food-ordering-portal:initial
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
